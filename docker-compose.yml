services:
  dsh:
    # Prebuilt multi-arch image published by GitHub Actions. For local
    # builds, add the build block from docker-compose.override.example.yml.
    image: ghcr.io/ghisgit/deepseek-harness-deploy:latest
    container_name: dsh
    restart: unless-stopped
    init: true
    ports:
      # dsh binds 127.0.0.1 inside the container (0.2.1 rejects wildcard binds
      # and 0.2.0 cannot bind a concrete interface); entrypoint.sh runs a small
      # TCP relay on the container's own interface, so this publish reaches the
      # harness. We default to publishing only on the host loopback because
      # dsh's web UI has no TLS/auth and agents execute arbitrary code. Set
      # BIND_ADDRESS=0.0.0.0 in .env to expose it.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3080}:${PORT:-3080}"
    env_file:
      # .env is optional; defaults below apply when it is absent.
      # (requires Docker Compose v2.24+)
      - path: .env
        required: false
    environment:
      # DSH_PORT is passed explicitly so the forwarder, the `dsh web --port`
      # argument, and the Dockerfile HEALTHCHECK stay in sync with .env.
      DSH_PORT: ${PORT:-3080}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Optional: interface the forwarder listens on. The entrypoint
      # auto-detects the container's own IPv4; set this for multi-homed
      # containers (dsh itself always stays on loopback).
      DSH_BIND_IP: ${DSH_BIND_IP:-}
      # Extra authorities the /api browser-trust fence accepts (comma-separated;
      # passed to `dsh web --trusted-host`; the relay's own address is added
      # automatically).
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      # Optional provider credentials; dsh also reads DEEPSEEK_API_KEY from the
      # web UI (Settings -> Models) into $DSH_HOME/.credentials.yaml.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # The whole Harness home (profiles, cordis.patch.yml, settings.yaml,
      # .credentials.yaml, .env, storages, .agent-presets) is persisted.
      - ${DATA_DIR:-./dsh}:/data/.dsh
      - ${WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
    command: ["web", "--no-open"]
